name: validate

on:
  push:
    branches: [master, "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Shell syntax
        run: bash -n entrypoint.sh
      - name: Unit tests
        run: node --test
      - name: Build image
        run: docker build --tag node-caged-ptero:test .
